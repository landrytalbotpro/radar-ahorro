<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar : combien te coûtent tes abonnements ?</title>
<meta name="description" content="Dépose ton relevé bancaire : Radar trouve tes abonnements oubliés, doublons, hausses de prix et frais bancaires, et prépare tes lettres de résiliation. Gratuit, tout reste sur ton appareil.">
<meta name="theme-color" content="#13202A">
<meta property="og:type" content="website">
<meta property="og:title" content="Radar : combien te coûtent vraiment tes abonnements ?">
<meta property="og:description" content="Abonnements oubliés, doublons, hausses de prix, frais bancaires : Radar les trouve dans ton relevé et prépare les lettres de résiliation. Gratuit, 100 % dans ton navigateur.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radar">
<link rel="preload" href="fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<script src="config.js"></script>
<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:500;font-display:swap;src:url(fonts/bricolage-grotesque-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:700;font-display:swap;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
:root{
  --paper:#EDF1F3; --surface:#FFFFFF; --ink:#13202A; --muted:#566673; --line:#CCD6DC;
  --water:#0F6E7A; --water-soft:#DCEDEF; --leak:#B23A26; --leak-soft:#F6E3DE;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F171D; --surface:#16222A; --ink:#E6EDF1; --muted:#93A4AF; --line:#2A3943;
    --water:#4FB3BF; --water-soft:#13323A; --leak:#F07A62; --leak-soft:#3A221D;
  }
}
:root[data-theme="dark"]{
  --paper:#0F171D; --surface:#16222A; --ink:#E6EDF1; --muted:#93A4AF; --line:#2A3943;
  --water:#4FB3BF; --water-soft:#13323A; --leak:#F07A62; --leak-soft:#3A221D;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:46rem;margin:0 auto;padding:0 1.25rem}
header{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 0}
.brand{display:flex;align-items:center;gap:.55rem;font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;color:var(--muted);font:700 .85rem var(--body);padding:.3rem .75rem;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6.5vw,3.6rem);line-height:1.02;letter-spacing:-.025em;margin:1.5rem 0 1rem;max-width:14ch}
.lead{color:var(--muted);max-width:38rem;margin:0 0 2rem}
.drop{display:block;border:2px dashed var(--line);border-radius:18px;background:var(--surface);padding:2.25rem 1.5rem;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--water);background:var(--water-soft)}
.drop:focus-within{outline:3px solid var(--water);outline-offset:3px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop strong{display:block;font-family:var(--display);font-size:1.35rem;font-weight:700;margin-bottom:.25rem}
.drop span{color:var(--muted);font-size:.95rem}
.drop .btn{margin-top:1.1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font:700 1rem var(--body);border-radius:12px;padding:.7rem 1.1rem;cursor:pointer;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.alt{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0 0}
.privacy{display:flex;gap:.6rem;align-items:flex-start;color:var(--muted);font-size:.92rem;margin:1.25rem 0 0}
.privacy svg{flex:none;margin-top:.2rem}
#pasteBox{margin-top:1rem}
#pasteBox label{display:block;font-weight:700;margin-bottom:.4rem;font-size:.95rem}
textarea{width:100%;min-height:9rem;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:.9rem/1.45 ui-monospace,Menlo,Consolas,monospace;padding:.8rem}
#status{margin:1.25rem 0 0;min-height:1.5rem}
.msg{border-radius:12px;padding:.9rem 1rem;background:var(--surface);border:1px solid var(--line)}
.msg.err{border-color:var(--leak);background:var(--leak-soft)}
/* results */
#results{padding:1rem 0 4rem}
.total{margin:1rem 0 2.5rem}
.total p{margin:0;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(3.4rem,13vw,6.5rem);line-height:.95;letter-spacing:-.04em;color:var(--leak);font-variant-numeric:tabular-nums;margin:.35rem 0 .4rem}
.big small{font-size:.28em;letter-spacing:0;color:var(--ink);font-weight:700;margin-left:.3rem}
.save{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;background:var(--water-soft);border-radius:16px;padding:1.1rem 1.25rem;margin-bottom:2.25rem}
.save p{margin:0}
.save .hint{color:var(--muted);font-size:.92rem}
.save .amt{font-family:var(--display);font-weight:800;font-size:2rem;color:var(--water);font-variant-numeric:tabular-nums;white-space:nowrap}
h2{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:-.01em;margin:2.25rem 0 .25rem}
.sub{color:var(--muted);margin:0 0 1rem;font-size:.95rem}
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.alerts li{background:var(--surface);border-left:4px solid var(--leak);border-radius:4px 12px 12px 4px;padding:.75rem 1rem}
.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:1fr auto;gap:.35rem 1rem;padding:1rem 0;border-bottom:1px solid var(--line);align-items:center}
.item .name{font-weight:700;font-size:1.08rem}
.item .meta{color:var(--muted);font-size:.9rem}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:.08rem .5rem;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--muted);margin-right:.35rem}
.tag.warn{background:var(--leak-soft);border-color:transparent;color:var(--leak)}
.price{text-align:right;font-variant-numeric:tabular-nums}
.price b{display:block;font-size:1.08rem}
.price span{color:var(--muted);font-size:.88rem}
.actions{grid-column:1 / -1;display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.35rem}
.toggle{display:inline-flex;align-items:center;gap:.5rem;border:1.5px solid var(--line);border-radius:10px;padding:.45rem .8rem;cursor:pointer;font-weight:700;font-size:.95rem;user-select:none}
.toggle input{width:1.1rem;height:1.1rem;accent-color:var(--leak);margin:0}
.toggle:has(input:checked){border-color:var(--leak);background:var(--leak-soft);color:var(--leak)}
.linkbtn{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:.45rem .8rem;font:700 .95rem var(--body);cursor:pointer}
.item.cut .name{text-decoration:line-through;text-decoration-color:var(--leak);text-decoration-thickness:2px}
details{margin-top:2.25rem}
details summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.5rem;list-style-position:outside}
.foot{color:var(--muted);font-size:.88rem;margin-top:2.5rem}
.note{color:var(--muted);font-size:.92rem;margin:.25rem 0 0}
dialog{border:0;border-radius:18px;padding:0;max-width:40rem;width:calc(100% - 2rem);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,26,.55)}
.dlg{padding:1.4rem}
.dlg h3{font-family:var(--display);font-size:1.35rem;margin:0 0 .5rem}
.dlg .tip{color:var(--muted);font-size:.93rem;margin:0 0 1rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem}
.fields label{font-size:.88rem;font-weight:700;display:grid;gap:.3rem}
.fields input{border:1.5px solid var(--line);border-radius:10px;padding:.55rem .7rem;font:1rem var(--body);background:var(--paper);color:var(--ink)}
.dlg textarea{min-height:15rem;font-family:var(--body);font-size:.95rem}
.dlg .row{display:flex;justify-content:flex-end;gap:.6rem;margin-top:.9rem;flex-wrap:wrap}
[hidden]{display:none!important}
@media (max-width:540px){
  .fields{grid-template-columns:1fr}
  .item{grid-template-columns:1fr}
  .price{text-align:left}
  .save .amt{font-size:1.7rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* bêta, retours, pied de page */
.beta{font:700 .7rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--water);background:var(--water-soft);border-radius:999px;padding:.12rem .5rem;margin-left:.15rem}
.fb{margin-top:2.75rem;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.4rem}
.fb h2{margin-top:0}
.vote{display:flex;flex-wrap:wrap;gap:.5rem;margin:.25rem 0 1rem}
.chip{display:inline-flex;align-items:center;gap:.45rem;border:1.5px solid var(--line);border-radius:999px;padding:.5rem .95rem;cursor:pointer;font-weight:700;font-size:.95rem;user-select:none}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip:has(input:checked){border-color:var(--water);background:var(--water-soft);color:var(--water)}
.chip:has(input:focus-visible){outline:3px solid var(--water);outline-offset:2px}
.fb select,.fb input[type=email]{border:1.5px solid var(--line);border-radius:10px;padding:.55rem .7rem;font:1rem var(--body);background:var(--paper);color:var(--ink);width:100%}
.fb .full{display:grid;gap:.3rem;font-size:.88rem;font-weight:700}
.fb textarea{min-height:5.5rem;font-family:var(--body);font-size:.95rem}
.fb .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:.9rem}
.fb .sent{color:var(--muted);font-size:.86rem;margin:.75rem 0 0}
.fb .ok{color:var(--water);font-weight:700}
.fb .ko{color:var(--leak);font-weight:700}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.site-foot{border-top:1px solid var(--line);margin-top:3rem;padding:1.25rem 0 2rem;color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;justify-content:space-between}
.site-foot a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="16" cy="16" r="7.5" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".5"/><path d="M16 16 L27 9" stroke="#B23A26" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="2.4" fill="currentColor"/></svg>
      Radar <span class="beta">bêta</span>
    </div>
    <div class="lang" role="group" id="langGroup" aria-label="Langue">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </div>
  </header>

  <main>
    <section id="intro">
      <h1 data-i="title"></h1>
      <p class="lead" data-i="lead"></p>

      <label class="drop" id="drop">
        <input type="file" id="file" accept=".pdf,.csv,.xlsx,.xls,.ods,.txt,application/pdf,text/csv,text/plain,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple>
        <strong data-i="drop"></strong>
        <span data-i="dropHint"></span><br>
        <span class="btn" data-i="choose"></span>
      </label>

      <div class="alt">
        <button type="button" class="btn ghost" id="pasteToggle" data-i="paste"></button>
        <button type="button" class="btn ghost" id="demoBtn" data-i="demo"></button>
      </div>

      <div id="pasteBox" hidden>
        <label for="pasteArea" data-i="pasteLabel"></label>
        <textarea id="pasteArea" spellcheck="false"></textarea>
        <div class="alt"><button type="button" class="btn" id="pasteGo" data-i="analyze"></button></div>
      </div>

      <p class="privacy">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i="privacy"></span>
      </p>
      <div id="status" aria-live="polite"></div>
    </section>

    <section id="results" hidden>
      <div class="total">
        <p data-i="totalLabel"></p>
        <div class="big" id="bigTotal">0</div>
        <p id="perMonth"></p>
        <p class="note" id="oneMonth" hidden data-i="oneMonth"></p>
      </div>

      <div class="save">
        <div>
          <p><b data-i="saveLabel"></b></p>
          <p class="hint" data-i="saveHint"></p>
        </div>
        <div class="amt" id="saveAmt">0</div>
      </div>

      <div id="alertsWrap">
        <h2 data-i="alertsTitle"></h2>
        <ul class="alerts" id="alerts"></ul>
      </div>

      <h2 data-i="listTitle"></h2>
      <p class="sub" data-i="listHint"></p>
      <ul class="items" id="items"></ul>
      <p class="msg" id="emptyMsg" hidden data-i="empty"></p>

      <details id="fixedWrap">
        <summary><span data-i="fixedTitle"></span> <span id="fixedTotal" class="sub"></span></summary>
        <p class="sub" data-i="fixedHint"></p>
        <ul class="items" id="fixed"></ul>
      </details>

      <section class="fb" id="fb" hidden aria-labelledby="fbTitle">
        <h2 id="fbTitle" data-i="fbTitle"></h2>
        <p class="sub" data-i="fbHint"></p>
        <form id="fbForm" novalidate>
          <div class="vote" role="radiogroup" aria-labelledby="fbTitle">
            <label class="chip"><input type="radio" name="verdict" value="ok"><span data-i="fbYes"></span></label>
            <label class="chip"><input type="radio" name="verdict" value="partial"><span data-i="fbPartial"></span></label>
            <label class="chip"><input type="radio" name="verdict" value="ko"><span data-i="fbNo"></span></label>
          </div>
          <div class="fields">
            <label><span data-i="fbBank"></span>
              <select id="fbBank" name="bank">
                <option value="" data-i="fbBankPick"></option>
                <optgroup label="España"><option>BBVA</option><option>Santander</option><option>CaixaBank</option><option>Sabadell</option><option>Bankinter</option><option>ING España</option><option>Unicaja</option><option>Kutxabank</option><option>Abanca</option><option>Ibercaja</option><option>Openbank</option><option>Cajamar</option><option>Caja Rural</option></optgroup>
                <optgroup label="France"><option>Crédit Agricole</option><option>BNP Paribas</option><option>Société Générale</option><option>LCL</option><option>Crédit Mutuel</option><option>CIC</option><option>Caisse d'Épargne</option><option>Banque Populaire</option><option>La Banque Postale</option><option>BoursoBank</option><option>Fortuneo</option><option>Hello bank!</option></optgroup>
                <optgroup label="Online"><option>Revolut</option><option>N26</option><option>Wise</option><option>Qonto</option><option>Trade Republic</option></optgroup>
                <option value="other" data-i="fbOther"></option>
              </select>
            </label>
            <label><span data-i="fbEmail"></span><input type="email" id="fbEmail" name="email" autocomplete="email" inputmode="email"></label>
          </div>
          <label class="full"><span data-i="fbComment"></span><textarea id="fbComment" name="comment" maxlength="1000"></textarea></label>
          <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
          <p class="sent" id="fbSent"></p>
          <div class="row"><button type="submit" class="btn" id="fbBtn" data-i="fbSend"></button><span id="fbStatus" aria-live="polite"></span></div>
        </form>
      </section>

      <p class="foot" data-i="footnote"></p>
      <button type="button" class="btn ghost" id="restart" data-i="restart"></button>
    </section>
  </main>
  <footer class="site-foot">
    <span>© 2026 Radar · <span data-i="footLocal"></span></span>
    <a href="privacidad.html" data-i="footPrivacy"></a>
  </footer>
</div>

<dialog id="dlg">
  <div class="dlg">
    <h3 id="dlgTitle"></h3>
    <p class="tip" id="dlgTip"></p>
    <div class="fields">
      <label><span data-i="yourName"></span><input id="fName" autocomplete="name"></label>
      <label><span data-i="yourRef"></span><input id="fRef" autocomplete="email"></label>
    </div>
    <textarea id="letter" readonly></textarea>
    <div class="row">
      <button type="button" class="btn ghost" id="dlgClose" data-i="close"></button>
      <button type="button" class="btn" id="copyBtn" data-i="copy"></button>
    </div>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>

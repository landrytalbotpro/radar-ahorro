@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-display:swap;src:url(/fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-display:swap;src:url(/fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
:root{--paper:#EDF1F3;--surface:#FFFFFF;--ink:#13202A;--muted:#566673;--line:#CCD6DC;--water:#0F6E7A}
@media (prefers-color-scheme: dark){:root{--paper:#0F171D;--surface:#16222A;--ink:#E6EDF1;--muted:#93A4AF;--line:#2A3943;--water:#4FB3BF}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font:1.05rem/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;padding:1.25rem}
main{max-width:30rem;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.75rem 1.5rem;text-align:center}
svg{width:48px;height:48px}
h1{font:800 1.9rem/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:.75rem 0 .5rem}
p{color:var(--muted);margin:.25rem 0}
hr{border:0;border-top:1px solid var(--line);margin:1.25rem 0}
.btns{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.25rem}
a.btn{display:inline-block;font-weight:700;text-decoration:none;border-radius:12px;padding:.7rem 1.1rem;border:1.5px solid var(--ink);color:var(--ink)}
a.btn.main{background:var(--ink);color:var(--paper)}
a.btn:focus-visible{outline:3px solid var(--water);outline-offset:2px}
</style>
</head>
